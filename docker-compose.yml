services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PROMETHEUS_PORT=8001
      - APP_PORT=8000
      # БЗ: kb/KB.pdf (ТЗ Б.4). Админка (опционально)
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - KB_MAX_FILE_SIZE_MB=${KB_MAX_FILE_SIZE_MB:-20}
      # Qdrant (для гибридного поиска Б.1 — следующая итерация)
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NO_PROXY=api.openai.com,localhost,127.0.0.1,postgres,redis,prometheus,qdrant
      - no_proxy=api.openai.com,localhost,127.0.0.1,postgres,redis,prometheus,qdrant
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - kb_data:/app/kb
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis: только хранение ключей (сессии, кэш, контекст чата). Лимит 512 МБ, при нехватке — evict по LRU.
  redis:
    image: redis:7
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - chatagent_grafana_data:/var/lib/grafana 
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kb_data:
  qdrant_data:
  chatagent_grafana_data:
  prometheus_data: